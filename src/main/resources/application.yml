spring:
  profiles:
    active: prod
  application:
    name: nexmart

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:请在application-prod.yml中配置}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
      connect-timeout: 10000
      read-timeout: 30000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:3306/nexmart_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 2
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    connection-timeout: 5000
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}
        concurrency: 5
        max-concurrency: 10
        acknowledge-mode: manual
        prefetch: 1

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8087
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
      enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.nex.nexmart.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:请在application-prod.yml中配置}
  expiration: 86400000

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID:请在application-prod.yml中配置}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:请在application-prod.yml中配置}
    bucket-name: java-poke
    url-prefix: https://java-poke.oss-cn-beijing.aliyuncs.com/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

alipay:
  app-id: ${ALIPAY_APP_ID:请在application-prod.yml中配置}
  private-key: ${ALIPAY_PRIVATE_KEY:请在application-prod.yml中配置}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:请在application-prod.yml中配置}
  seller-id: ${ALIPAY_SELLER_ID:}
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: ${ALIPAY_NOTIFY_URL:请在application-prod.yml中配置}
  return-url: https://nexmart.tech/api/user/payment/return

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://nexmart.tech}

logging:
  level:
    com.nex.nexmart: debug
    org.springframework.security: info
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
