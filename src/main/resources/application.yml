spring:
  application:
    name: nexmart

  # ========== 引入deepseek ==========
  ai:
    openai:
      api-key: # 你的 DeepSeek API Key
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat

  # ========== MySQL 数据源 ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nexmart_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: # 你的 MySQL 用户名
    password: # 你的 MySQL 密码

    # ========== Redis 配置 ==========
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ========== RabbitMQ 配置 ==========
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5000
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        acknowledge-mode: manual
        prefetch: 1

  # ========== 文件上传配置 ==========
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # ========== Jackson JSON 配置 ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ========== 服务端口与上下文路径 ==========
server:
  port: 8087
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
      enabled: true

# ========== MyBatis-Plus 配置 ==========
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.nex.nexmart.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== JWT 配置 ==========
jwt:
  secret: # 自定义 JWT 密钥，生产环境请务必修改
  expiration: 86400000

# ========== 阿里云 OSS 配置 ==========
aliyun:
  oss:
    endpoint: # 你的 OSS endpoint（如 oss-cn-beijing.aliyuncs.com）
    access-key-id: # 你的 AccessKeyId
    access-key-secret: # 你的 AccessKeySecret
    bucket-name: # 你的 Bucket 名称
    url-prefix: # OSS 文件访问域名前缀

# ========== SpringDoc / Swagger UI ==========
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

alipay:
  app-id: # 你的沙箱 AppId
  private-key: # 你的应用私钥
  alipay-public-key: # 支付宝公钥
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: # 支付宝异步回调地址（需公网可访问，本地开发推荐使用 ngrok）
  return-url: http://localhost:8087/api/user/payment/return

# ========== 日志配置 ==========
logging:
  level:
    com.nexmart: debug
    org.springframework.security: debug
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"